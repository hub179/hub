<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1A364F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ARCON SITE">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <title>ARCON SITE</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; font-family: Tahoma, Arial, sans-serif; }
    #load { position: fixed; inset: 0; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 5; }
    #load img { width: min(60vw, 260px); height: auto; }
    #load b { color: #1A364F; letter-spacing: 3px; font-size: 15px; }
    #load i { width: 120px; height: 3px; background: #eef1f4; border-radius: 3px; overflow: hidden; position: relative; }
    #load i::after { content: ""; position: absolute; inset: 0; width: 40%; background: #E8732A; animation: run 1.1s infinite ease-in-out; }
    @keyframes run { from { transform: translateX(-120%); } to { transform: translateX(320%); } }
    #load small { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom)); left: 14px; color: #8a96a3; font-size: 11px; direction: ltr; }
    #msg { display: none; max-width: 320px; text-align: center; font-size: 14px; color: #1A364F; line-height: 1.7; }
    #msg button { margin-top: 10px; border: 0; border-radius: 8px; padding: 9px 16px; background: #990000; color: #fff; font: inherit; font-weight: bold; }
  </style>
  <script src="../config.js"></script>
</head>
<body>
  <!-- ARCON SITE — daily site follow-up app shell. Loads the screens from the ARCON server (?app=site) and shows them here. -->
  <div id="load">
    <img src="../icon-512.png" alt="ARCON">
    <b>ARCON SITE</b><i></i>
    <div id="msg">تعذّر الاتصال — اتأكد من النت<br><button onclick="location.reload()">إعادة المحاولة</button></div>
    <small>Made by Abdelhamed Osama</small>
  </div>
  <script>
    (function () {
      var EXEC = (window.ARCON_CONFIG && window.ARCON_CONFIG.APP_URL) || '';
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
      var bridge = 'window.google={script:{run:(function make(ok,ko){return new Proxy({},{get:function(_,fn){' +
        'if(fn==="withSuccessHandler")return function(f){return make(f,ko)};' +
        'if(fn==="withFailureHandler")return function(f){return make(ok,f)};' +
        'return function(){var a=Array.prototype.slice.call(arguments);' +
        'fetch(' + JSON.stringify(EXEC) + ',{method:"POST",credentials:"omit",body:JSON.stringify({fn:fn,args:a})})' +
        '.then(function(r){return r.text()}).then(function(t){ok&&ok(t)}).catch(function(e){ko&&ko(e)})}}})})()}};';
      function failed() { document.getElementById('msg').style.display = 'block'; document.querySelector('#load i').style.display = 'none'; }
      fetch(EXEC + (EXEC.indexOf('?') < 0 ? '?' : '&') + 'view=shell&app=site', { credentials: 'omit', cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(function (html) {
          if (html.indexOf('ARCON SITE') < 0 || html.indexOf('stBoot') < 0) throw new Error('unexpected page');
          var head = '<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="../apple-touch-icon.png">' +
                     '<link rel="icon" href="../icon-192.png" type="image/png"><script>' + bridge + '<\/script>';
          html = html.replace(/<head>/i, '<head>' + head);
          document.open(); document.write(html); document.close();
        })
        .catch(failed);
    })();
  </script>
</body>
</html>
