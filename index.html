<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1A364F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ARCON HUB">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>ARCON PROJECT HUB</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; font-family: Tahoma, Arial, sans-serif; overflow: hidden; }
    iframe { border: 0; width: 100%; height: 100%; display: block; background: #F4F6F8; }
    #load { position: fixed; inset: 0; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; transition: opacity .5s; z-index: 5; }
    #load img { width: min(60vw, 260px); height: auto; }
    #load b { color: #1A364F; letter-spacing: 3px; font-size: 15px; }
    #load i { width: 120px; height: 3px; background: #eef1f4; border-radius: 3px; overflow: hidden; position: relative; }
    #load i::after { content: ""; position: absolute; inset: 0; width: 40%; background: #E8732A; animation: run 1.1s infinite ease-in-out; }
    @keyframes run { from { transform: translateX(-120%); } to { transform: translateX(320%); } }
    #load small { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom)); left: 14px; color: #8a96a3; font-size: 11px; direction: ltr; }
    .bar { position: fixed; z-index: 6; inset-inline: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); background: #1A364F; color: #fff; border-radius: 12px; padding: 10px 12px;
           display: none; align-items: center; gap: 10px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
    .bar.show { display: flex; }
    .bar span { flex: 1; line-height: 1.5; }
    .bar button { border: 0; border-radius: 8px; padding: 8px 12px; font: inherit; font-weight: bold; cursor: pointer; }
    .bar .go { background: #E8732A; color: #fff; }
    .bar .x { background: transparent; color: #cfd8e3; padding: 8px; }
    #slow { display: none; margin-top: 6px; font-size: 12px; color: #6b7785; text-align: center; }
    #slow a { color: #990000; font-weight: bold; }
  </style>
  <script src="config.js"></script>
</head>
<body>
  <!--
    Installable shell ("app") for the ARCON PROJECT HUB Apps Script Web App.
    Apps Script pages cannot register a manifest / service worker themselves, so this small static page (hosted on any
    HTTPS static host, e.g. GitHub Pages) gives the phone app icon + full-screen experience and shows the Web App inside.
    No company data is stored or cached here — sign-in (company e-mail + code) and all data stay in the Web App.
  -->
  <div id="load">
    <img src="icon-512.png" alt="ARCON">
    <b>ARCON PROJECT HUB</b><i></i>
    <div id="slow">لو البرنامج مافتحش / Not loading? <a id="direct" target="_blank" rel="noopener">افتحه مباشرة / Open directly</a></div>
    <small>Made by Abdelhamed Osama</small>
  </div>
  <iframe id="app" title="ARCON PROJECT HUB" allow="clipboard-write; fullscreen"></iframe>

  <div class="bar" id="installBar"><span>ثبّت البرنامج على موبايلك عشان يفتح زي أي تطبيق<br><small>Install ARCON HUB on this phone</small></span>
    <button class="go" id="installGo">تثبيت</button><button class="x" id="installX" aria-label="close">✕</button></div>
  <div class="bar" id="iosBar"><span>للتثبيت على الآيفون: دوس <b>مشاركة ⬆︎</b> وبعدين <b>إضافة إلى الشاشة الرئيسية</b><br><small>iPhone: Share ⬆︎ → Add to Home Screen</small></span>
    <button class="x" id="iosX" aria-label="close">✕</button></div>

  <script>
    var url = (window.ARCON_CONFIG && window.ARCON_CONFIG.APP_URL) || '';
    var frame = document.getElementById('app'), load = document.getElementById('load');
    document.getElementById('direct').href = url;
    frame.addEventListener('load', function () { setTimeout(function () { load.style.opacity = '0'; setTimeout(function () { load.style.display = 'none'; }, 500); }, 400); });
    setTimeout(function () { document.getElementById('slow').style.display = 'block'; }, 15000);
    frame.src = url;

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

    var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    function dismissed() { try { return localStorage.getItem('arcon.installHide') === '1'; } catch (e) { return false; } }
    function hide(id) { document.getElementById(id).classList.remove('show'); try { localStorage.setItem('arcon.installHide', '1'); } catch (e) { /* ignore */ } }
    var promptEv = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault(); promptEv = e;
      if (!standalone && !dismissed()) document.getElementById('installBar').classList.add('show');
    });
    document.getElementById('installGo').onclick = function () {
      if (!promptEv) return;
      promptEv.prompt();
      promptEv.userChoice.then(function () { promptEv = null; document.getElementById('installBar').classList.remove('show'); });
    };
    document.getElementById('installX').onclick = function () { hide('installBar'); };
    document.getElementById('iosX').onclick = function () { hide('iosBar'); };
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (ios && !standalone && !dismissed()) setTimeout(function () { document.getElementById('iosBar').classList.add('show'); }, 2500);
  </script>
</body>
</html>
